services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsefx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsefx}
      POSTGRES_DB: ${POSTGRES_DB:-pulsefx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pulsefx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsefx} -d ${POSTGRES_DB:-pulsefx}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-pulsefx}:${POSTGRES_PASSWORD:-pulsefx}@postgres:5432/${POSTGRES_DB:-pulsefx}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      FRED_API_KEY: ${FRED_API_KEY:-changeme}
      SYNC_TTL_MINUTES: ${SYNC_TTL_MINUTES:-60}
      ADMIN_SYNC_KEY: ${ADMIN_SYNC_KEY:-changeme}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  pulsefx_postgres_data:
